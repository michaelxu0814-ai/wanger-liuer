<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; }
  body {
    background:#12110f; color:#e8e2d6;
    display:flex; flex-direction:column;
    justify-content:space-between;
    padding:110px 96px 96px;
    font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;
    position:relative;
  }
  .top { display:flex; align-items:center; gap:14px; }
  .mark { width:34px; height:3px; background:#c2410c; }
  .note { font-size:26px; letter-spacing:0.22em; opacity:.55; }
  .quote {
    font-size:96px; line-height:1.52; font-weight:600;
    letter-spacing:0.02em;
    display:flex; flex-direction:column;
  }
  .quote span { display:block; }
  .quote span:nth-child(2) { color:#c2410c; }
  .bottom { display:flex; justify-content:space-between; align-items:flex-end; }
  .author { font-size:34px; letter-spacing:0.28em; opacity:.8; }
  .sig { width:120px; height:2px; background:#c2410c; opacity:.5; margin-top:18px; }
  .idx { font-size:20px; letter-spacing:0.3em; opacity:.35; }
</style></head>
<body>
  <div class="top"><div class="mark"></div><div class="note">读 Apate 之后</div></div>
  <div class="quote"><span>这生意的底子，</span><span>不是骗，是陪。</span></div>
  <div class="bottom">
    <div><div class="author">王二</div><div class="sig"></div></div>
    <div class="idx">王二 × 刘二</div>
  </div>
</body></html>
